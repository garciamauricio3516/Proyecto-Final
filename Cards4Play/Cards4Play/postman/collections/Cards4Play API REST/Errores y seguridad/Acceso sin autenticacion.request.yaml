$kind: http-request
url: "\t{{baseUrl}}/productos"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Codigo HTTP 401 Unauthorized\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"La respuesta es JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"La respuesta contiene un mensaje de error\", function () {\r

      \    pm.expect(pm.response.json().error).to.be.a(\"string\");\r

      });"
    language: text/javascript
order: 1000
