$kind: http-request
url: "\t{{baseUrl}}/cartas"
method: POST
body:
  type: json
  content: "{\r

    \    \"nombre\": \"Carta no autorizada\",\r

    \    \"rareza\": \"R\",\r

    \    \"precioUsd\": 10\r

    }"
auth:
  type: basic
  credentials:
    username: "{{clientUser}}"
    password: "{{clientPassword}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Codigo HTTP 403 Forbidden\", function () {\r

      \    pm.response.to.have.status(403);\r

      });\r

      \r

      pm.test(\"La respuesta es JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"El cliente no tiene permisos de administrador\", function () {\r

      \    pm.expect(pm.response.json().error).to.be.a(\"string\");\r

      });"
    language: text/javascript
order: 3000
