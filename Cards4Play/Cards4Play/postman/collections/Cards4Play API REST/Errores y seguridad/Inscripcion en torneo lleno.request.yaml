$kind: http-request
url: "{{baseUrl}}/torneos/{{idTorneo}}/inscripciones"
method: POST
auth:
  type: basic
  credentials:
    username: "{{nuevoCliente}}"
    password: "{{clientPassword}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Codigo HTTP 409 Conflict\", function () {\r

      \    pm.response.to.have.status(409);\r

      });\r

      \r

      pm.test(\"La respuesta es JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"No se permite superar la capacidad del torneo\", function () {\r

      \    pm.expect(pm.response.json().error).to.be.a(\"string\");\r

      });"
    language: text/javascript
order: 11000
