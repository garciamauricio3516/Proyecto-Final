$kind: http-request
url: "\t{{baseUrl}}/usuarios/me"
method: GET
auth:
  type: basic
  credentials:
    username: "{{clientUser}}"
    password: "{{clientPassword}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Codigo HTTP 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"La respuesta es JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Cliente autenticado correctamente\", function () {\r

      \    const datos = pm.response.json();\r

      \    pm.expect(datos.nombreUsuario).to.eql(\r

      \        pm.collectionVariables.get(\"clientUser\")\r

      \    );\r

      });\r

      \r

      pm.test(\"Rol de cliente correcto\", function () {\r

      \    pm.expect(pm.response.json().rol).to.eql(\"CLIENTE\");\r

      });\r

      \r

      pm.test(\"La respuesta no expone la contrasena\", function () {\r

      \    pm.expect(pm.response.json()).to.not.have.property(\"contrasena\");\r

      });"
    language: text/javascript
order: 2000
